spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: route-calcul
              uri: lb://CALCUL-SERVICE
              predicates:
                - Path=/calcul/**
            - id: route-historique
              uri: lb://HISTORIQUE-SERVICE
              predicates:
                - Path=/operations/**
            - id: doc-calcul
              uri: lb://CALCUL-SERVICE
              predicates:
                - Path=/docs/calcul
              filters:
                - SetPath=/v3/api-docs
            - id: doc-historique
              uri: lb://HISTORIQUE-SERVICE
              predicates:
                - Path=/docs/historique
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: calcul-service
        url: /docs/calcul
      - name: historique-service
        url: /docs/historique
